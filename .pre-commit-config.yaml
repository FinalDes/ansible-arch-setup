---
repos:
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
        language_version: python3
        additional_dependencies:
          - ansible-core
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.5 # Matches your local uv version
    hooks:
      - id: uv-lock
