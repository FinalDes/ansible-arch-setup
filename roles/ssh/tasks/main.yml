---
# tasks file for roles/ssh
- name: Install openssh
  community.general.pacman:
    name: openssh
    state: present
- name: Ensure ssh_users group exists
  ansible.builtin.group:
    name: "{{ ssh_user_group }}"
    state: present
- name: Add current user to ssh_users group
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: "{{ ssh_user_group }}"
    append: true
  when: ssh_add_ssh_user | bool
- name: Ensure SSH host keys exist for validation
  ansible.builtin.command: ssh-keygen -A
  args:
    creates: /etc/ssh/ssh_host_ed25519_key
- name: Copy ssh-audit config file
  ansible.builtin.copy:
    src: ssh-audit_hardening.conf
    dest: /etc/ssh/sshd_config.d/999-audit_hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSHD
  when: ssh_restrict_key_exchange | bool
- name: Configure SSH to disable weak host keys
  ansible.builtin.template:
    src: harderning.conf.j2
    dest: /etc/ssh/sshd_config.d/999-host_hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSHD
- name: Ensure sshd is running and enabled
  ansible.builtin.service:
    name: sshd
    state: started
    enabled: true
