---
# tasks file for roles/ssh
- name: Load platform-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
- name: Install openssh
  community.general.pacman:
    name: openssh
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'
- name: Install openssh (Debian/Ubuntu)
  ansible.builtin.apt:
    name: openssh-server
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install openssh (RedHat/Alma/Rocky)
  ansible.builtin.dnf:
    name: openssh-server
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
- name: Ensure ssh_users group exists
  ansible.builtin.group:
    name: "{{ ssh_user_group }}"
    state: present
- name: Add current user to ssh_users group
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: "{{ ssh_user_group }}"
    append: true
  when: ssh_add_ssh_user | bool
- name: Generate the Ed25519 SSH host key natively
  community.crypto.openssh_keypair:
    path: /etc/ssh/ssh_host_ed25519_key
    type: ed25519
    owner: root
    group: root
    mode: "0600"
    force: false
- name: Copy ssh-audit config file
  ansible.builtin.copy:
    src: "ssh-audit_{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_version'] if ansible_facts['os_family'] != 'Archlinux' else '' }}.conf"
    dest: /etc/ssh/sshd_config.d/999-audit_hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "{{ ssh_dameon_binary_path }} -t -f %s"
  notify: Restart SSHD
  when:
    - ansible_facts['os_family'] in ['Debian', 'Archlinux']
    - ssh_restrict_key_exchange | bool
- name: Configure SSH to disable weak host keys
  ansible.builtin.template:
    src: harderning.conf.j2
    dest: /etc/ssh/sshd_config.d/999-host_hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "{{ ssh_dameon_binary_path }} -t -f %s"
  notify: Restart SSHD
- name: Ensure sshd is running and enabled
  ansible.builtin.systemd_service:
    name: "{{ ssh_service_name }}"
    state: started
    enabled: true
