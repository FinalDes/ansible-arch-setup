---
# tasks file for git
- name: Add python3-debian ansible module dependencies
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
    update_cache: true
  become: true
  vars:
    packages:
      - gnupg
      - python3-debian
- name: Add git ppa repository
  ansible.builtin.deb822_repository:
    name: ppa-git-core
    state: present
    types: [deb]
    uris: "https://ppa.launchpadcontent.net/git-core/ppa/ubuntu"
    suites: ["{{ ansible_facts['distribution_release'] | lower }}"]
    components: [main]
    signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xe363c90f8f1b6217"
    enabled: true
  become: true
  when: ansible_facts["distribution"] == 'Ubuntu'
- name: Update cache
  ansible.builtin.apt:
    update_cache: true
  become: true
