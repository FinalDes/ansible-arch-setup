---
# tasks file for git_setup
- name: Install git via pacman
  community.general.pacman:
    name: git
  when: ansible_facts['os_family'] == 'Archlinux'
- name: Install git-delta and helix via pacman
  community.general.pacman:
    name:
      - git-delta
      - git-filter-repo
      - helix
      - lazygit
    state: latest
    update_cache: true
  become: true
  when:
    - git_extra_tools is true
    - ansible_facts['os_family'] == 'Archlinux'
- name: Add github ppa when is ubuntu
  ansible.builtin.include_tasks: ubuntu_install.yml
  when: ansible_facts.distribution == "Ubuntu"
- name: Install git via apt
  ansible.builtin.apt:
    name: git
  when: ansible_facts['os_family'] == 'Debian'
- name: Install git git-delta and helix via apt
  ansible.builtin.apt:
    name:
      - git-delta
      - git-filter-repo
      - hx
      - lazygit
    state: present
    update_cache: true
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - git_extra_tools is true
- name: Install package in RedHat
  ansible.builtin.include_tasks: fedora_install.yml
  when: ansible_facts['os_family'] == 'RedHat'
- name: Deploy global git configuration from template
  ansible.builtin.template:
    src: "gitconfig.j2"
    dest: "{{ ansible_facts['env']['HOME'] }}/.gitconfig"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0600"
