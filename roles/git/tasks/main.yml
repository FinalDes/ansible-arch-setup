---
# tasks file for git_setup
- name: Install git git-delta and helix via pacman
  community.general.pacman:
    name:
      - git
      - git-delta
      - helix
      - lazygit
    state: latest
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == 'Archlinux'
- name: Install git git-delta and helix via apt
  ansible.builtin.apt:
    name:
      - git
      - git-delta
      - hx
      - lazygit
    state: present
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == 'Debian'
- name: Install package in RedHat
  ansible.builtin.include_tasks: fedora_install.yml
  when: ansible_facts['os_family'] == 'RedHat'
- name: Deploy global git configuration from template
  ansible.builtin.template:
    src: "gitconfig.j2"
    dest: "{{ ansible_facts['env']['HOME'] }}/.gitconfig"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0600"
