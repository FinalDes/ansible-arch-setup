---
# tasks file for git_setup
- name: Install git are installed
  community.general.pacman:
    name:
      - git
      - git-delta
      - helix
    state: latest
    update_cache: true
  become: true
- name: Deploy global git configuration from template
  ansible.builtin.template:
    src: "gitconfig.j2"
    dest: "{{ ansible_facts.env.HOME }}/.gitconfig"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_id }}"
    mode: "0600"
