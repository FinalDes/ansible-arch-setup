- name: Install dev tools
  ansible.builtin.dnf:
    name:
      - git
- name: Install extra tools
  when: git_extra_tools is true
  block:
    - name: Ensure dnf-plugins-core is installed
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present
      become: true
    - name: Enable COPR repositories
      community.general.copr:
        name: "{{ item }}"
        state: enabled
      become: true
      loop:
        - dejan/lazygit
        # - awood/bat-extras
    - name: Install dev tools
      ansible.builtin.dnf:
        name:
          - git-delta
          - helix
          - lazygit
          - git-filter-repo
        state: present
      become: true
