---
# tasks file for python_bootstrap
- name: Update pacman mirrorlist or refresh databases safely
  ansible.builtin.raw: pacman -Syu --noconfirm
  changed_when: false
  register: pacman_sync
  retries: 3
  delay: 5
  until: pacman_sync is success # noqa: var-naming[no-role-prefix]

- name: Install Python
  ansible.builtin.raw: pacman -S --needed --noconfirm python
  changed_when: false
